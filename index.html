<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>My Journey — ACS</title>
    <meta name="description" content="Perjalanan pertumbuhan 4 dimensi berdasarkan Lukas 2:52" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111111" />
    <meta name="background-color" content="#0D0D0D" />

    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My Journey" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Icon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- OG Preview -->
    <meta property="og:title" content="My Journey — ACS" />
    <meta property="og:description" content="Yesus bertumbuh di 4 area. Mulai hari ini, kita ukur keempatnya." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://acs-myjourney-two.vercel.app" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        height: 100%;
        width: 100%;
        background-color: #0D0D0D;
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        padding-top: env(safe-area-inset-top, 16px);
        padding-bottom: env(safe-area-inset-bottom, 16px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        background-color: #0D0D0D;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        background-color: #0D0D0D;
      }

      /* iOS Safari khusus */
      @supports (-webkit-touch-callout: none) {
        body {
          padding-top: max(env(safe-area-inset-top, 16px), 16px) !important;
          padding-bottom: max(env(safe-area-inset-bottom, 16px), 16px) !important;
        }
      }

      /* Android Chrome */
      @supports (padding: max(0px)) {
        body {
          padding-top: max(env(safe-area-inset-top), 16px);
          padding-bottom: max(env(safe-area-inset-bottom), 16px);
        }
      }

      .no-bounce {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        -webkit-tap-highlight-color: transparent;
      }

      .dark {
        background-color: #0D0D0D;
        color: #FFFFFF;
      }

      /* Animasi */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .acs-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .acs-rise {
        animation: rise 0.5s ease-out forwards;
        opacity: 0;
      }
    </style>
  </head>
  <body class="no-bounce">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
